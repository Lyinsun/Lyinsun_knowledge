schema_version: 1
repository:
  name: example-engineering-knowledge-base
  default_branch: main
  language: zh-CN
content:
  required_fields:
    - id
    - title
    - status
    - owner
    - last_reviewed
    - sources
  canonical_directories:
    - architecture
    - services
    - modules
    - concepts
    - interfaces
    - workflows
    - operations
    - decisions
privacy:
  commit_private_sources: false
  shareable_by_default: false
  required_source_record: true
tooling:
  python: ">=3.10"
  markdown: CommonMark
  optional_search: ripgrep
governance:
  maintenance: agent-guided
  lint_mode: advisory
  config_role: descriptive
